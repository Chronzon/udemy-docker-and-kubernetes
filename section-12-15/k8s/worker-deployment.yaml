apiVersion: apps/v1
kind: Deployment
metadata:
  name: fibonacci-worker-deployment
  namespace: fibonacci-namespace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
      - name: worker
        image: chronzon/fibonacci-app-worker:latest
        imagePullPolicy: Always

        env: 
        - name: REDIS_HOST
          value: fibonacci-redis-service
        - name: REDIS_PORT
          value: "6379"

        resources:
          requests:
            memory: 128Mi
            cpu: 100m
          limits:
            memory: 256Mi
            cpu: 250m