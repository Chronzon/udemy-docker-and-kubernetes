apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fibonacci-api-ingress
  namespace: fibonacci-namespace
  annotation:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: fibonacci-namespace-strip-api-prefix@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http: 
      paths: 
        - path: /api
          pathType: Prefix 
          backend: 
            service: 
              name: fibonacci-server-service
              port:
                number: 5000
---
apiVersion: networking.k8s.io/v1
kind: Ingress 
metadata: 
  name: fibonacci-client-ingress
  namespace: fibonacci-namespace
  annotation: 
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec: 
  ingressClassName: traefik
  rules: 
    - http: 
        paths: 
          - path: /
            pathType: Prefix 
            backend: 
              service: 
                name: fibonacci-client-service
                port: 
                  number: 3000
