apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deployment
  namespace: fibonacci-namespace
spec:
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres

    spec:
      containers:
      - name: postgres
        image: postgres:13
        imagePullPolicy: Always

        ports:
        - name: postgres-port
          containerPort: 5432

        env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-auth
              key: password

        volumeMounts:
          - name: postgres-data
            mountPath: /var/lib/postgresql/data

        resources:
          requests:
            memory: 64Mi
            cpu: 250m
          limits:
            memory: 128Mi
            cpu: 500m

      volumes:
      - name: postgres-data
        persistentVolumeClaim:
          claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: fibonacci-namespace
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - name: postgres-port
      port: 5432
      targetPort: postgres-port
