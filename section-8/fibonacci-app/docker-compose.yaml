---
services: 

  nginx:
    image: ${DOCKERHUB_USERNAME}/fibonacci-app-nginx:${GITHUB_SHA}
    ports:
      - 80:80
    restart: always
    depends_on:
      - client
      - api

  postgres: 
    image: postgres:13-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:6-alpine

  api:
    image: ${DOCKERHUB_USERNAME}/fibonacci-app-server:${GITHUB_SHA}
    environment:
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=6379
      - PGUSER=${PGUSER}
      - PGHOST=${PGHOST}
      - PGDATABASE=${PGDATABASE}
      - PGPASSWORD=${PGPASSWORD}
      - PGPORT=5432
    depends_on:
      - redis
      - postgres

  worker:
    image: ${DOCKERHUB_USERNAME}/fibonacci-app-worker:${GITHUB_SHA}
    environment:
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=6379
    depends_on:
      - redis

  client:
    image: ${DOCKERHUB_USERNAME}/fibonacci-app-client:${GITHUB_SHA}
    environment:
      - WDS_SOCKET_PORT=0
    depends_on:
      - api

volumes:
  postgres-data:

