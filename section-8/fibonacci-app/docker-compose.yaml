---
services: 

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile.dev
    ports:
      - 8888:80
    restart: always
    depends_on:
      - client
      - api

  postgres: 
    image: postgres:13-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: postgres
    # ports:
    #   - 5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:6-alpine
    # ports:
    #   - 6379:6379

  api:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PGUSER=postgres
      - PGHOST=postgres
      - PGDATABASE=postgres
      - PGPASSWORD=postgres_password
      - PGPORT=5432
    # ports:
    #   - 5000:5000
    volumes:
      - ./server:/app
      - server-node-modules:/app/node_modules
    depends_on:
      - redis
      - postgres

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile.dev
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./worker:/app
      - worker-node-modules:/app/node_modules
    depends_on:
      - redis

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    environment:
      - WDS_SOCKET_PORT=0
    # ports:
    #   - 3000:3000
    volumes:
      - ./client:/app
      - client-node-modules:/app/node_modules
    depends_on:
      - api

volumes:
  postgres-data:
  server-node-modules:
  worker-node-modules:
  client-node-modules:
