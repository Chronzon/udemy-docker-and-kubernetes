---
services: 

  nginx:
    image: ${DOCKERHUB_USERNAME}/fibonacci-app-nginx:latest
    expose:
      - 80
    restart: always
    depends_on:
      - client
      - api

  postgres: 
    image: postgres:13-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:6-alpine

  api:
    image: ${DOCKERHUB_USERNAME}/fibonacci-app-server:latest
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PGUSER=${PGUSER}
      - PGHOST=postgres
      - PGDATABASE=${PGDATABASE}
      - PGPASSWORD=${PGPASSWORD}
      - PGPORT=5432
    depends_on:
      - redis
      - postgres

  worker:
    image: ${DOCKERHUB_USERNAME}/fibonacci-app-worker:latest
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis

  client:
    image: ${DOCKERHUB_USERNAME}/fibonacci-app-client:latest
    depends_on:
      - api

volumes:
  postgres-data:

