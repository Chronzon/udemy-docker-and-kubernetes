name: Section 8-12 CI/CD
on:
  pull_request:
    branches:
      - main
    paths:
      - 'section-8/fibonacci-app/**'
      - '.github/workflows/section-8-12-ci-cd.yaml'

  push:
    branches:
      - main
    paths:
      - 'section-8/fibonacci-app/**'
      - '.github/workflows/section-8-12-ci-cd.yaml'

permissions:
  contents: read


jobs:
  publish-image-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./section-8/fibonacci-app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and Push Docker Image
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker build -t $DOCKER_USER/fibonacci-app-server:latest ./server
          docker push $DOCKER_USER/fibonacci-app-server:latest

          docker build -t $DOCKER_USER/fibonacci-app-worker:latest ./worker
          docker push $DOCKER_USER/fibonacci-app-worker:latest

          docker build -t $DOCKER_USER/fibonacci-app-client:latest ./client
          docker push $DOCKER_USER/fibonacci-app-client:latest

          docker build -t $DOCKER_USER/fibonacci-app-nginx:latest ./nginx
          docker push $DOCKER_USER/fibonacci-app-nginx:latest

  deploy-container-cd:
    needs: publish-image-ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Trigger Coolify Deployment 
        env: 
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          curl --fail-with-body \
            -X POST "$COOLIFY_WEBHOOK" \
            -H "Authorization: Bearer $COOLIFY_TOKEN"
